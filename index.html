<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Třídní sázky</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<style>
:root{color-scheme:dark;--bg:#0b0b0c;--card:#161618;--line:#2c2c30;--tx:#f2f2f2;--mu:#9a9aa2;--ac:#f2c94c;--onac:#111;--ok:#6fcf97;--bad:#eb7b6b;--in:#0f0f11;--winbg:#14281c}
:root[data-theme=light]{color-scheme:light;--bg:#f4f4f6;--card:#fff;--line:#d9d9de;--tx:#17171a;--mu:#6b6b75;--ac:#b86e00;--onac:#fff;--ok:#1f9d55;--bad:#d64545;--in:#f0f0f3;--winbg:#e3f5ea}
#tg{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:22px;box-shadow:0 2px 8px #0004;z-index:5;padding:0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 "Trebuchet MS",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(70px + env(safe-area-inset-bottom))}
main,header,nav,#auth{max-width:560px;margin:0 auto;padding:12px 14px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
header span{font-size:14px;color:var(--mu)}header b{color:var(--tx)}
a{color:var(--ac);cursor:pointer;margin-left:6px}
nav{display:flex;gap:8px;padding-top:0}
nav button{flex:1;padding:10px;border:1px solid var(--line);background:none;color:var(--mu);border-radius:10px;font:inherit}
nav .on{background:var(--ac);color:var(--onac);border-color:var(--ac);font-weight:bold}
h1{font-size:30px;margin:30px 0 4px}h3{color:var(--mu);font-weight:normal;margin:24px 0 8px}
.m{color:var(--mu)}
input,select,textarea{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid var(--line);background:var(--in);color:var(--tx);font:inherit}
.btn,.go{background:var(--ac);color:var(--onac);border:0;border-radius:10px;padding:12px 16px;font:inherit;font-weight:bold;width:100%;margin-top:6px}
.btn.sec{background:none;color:var(--ac);border:1px solid var(--ac)}
.err{color:var(--bad);min-height:22px}
.c{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.c small{color:var(--mu)}.c .t{font-size:18px;margin:2px 0 8px}
.o{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 8px;padding:12px;margin-top:8px;border:1px solid var(--line);border-radius:10px;background:var(--in)}
.o.sel{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.o.win{border-color:var(--ok);background:var(--winbg)}
.o small{width:100%}
.a{background:none;border:1px solid var(--ok);color:var(--ok);border-radius:8px;padding:4px 8px;font:inherit;font-size:13px}
.bar{display:flex;gap:6px;margin-top:10px}.bar input{margin:0;flex:1;min-width:0}
.bar button{border:1px solid var(--line);background:none;color:var(--tx);border-radius:10px;padding:0 12px;font:inherit}
.bar .go{width:auto;margin:0;border:0;background:var(--ac);color:var(--onac)}
.pl{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.pl.me{color:var(--ac);font-weight:bold}
.av{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--line);display:inline-flex;align-items:center;justify-content:center;font-weight:bold;margin-right:8px;flex:none;color:var(--tx)}
.av.me{cursor:pointer;border:2px solid var(--ac)}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.dy{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.dy>b{width:44px;flex:none}.dy>b small{display:block;color:var(--mu);font-weight:normal}
.dy>div{display:flex;flex-wrap:wrap;gap:6px}
.ls{background:var(--in);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font:inherit;font-size:14px}
.ls small{color:var(--mu);margin-right:4px}.ls:disabled{opacity:.35}
.ls.on{background:var(--ac);color:var(--onac);border-color:var(--ac)}.ls.on small{color:var(--onac)}
.o span{flex:1}
.od{background:var(--ac);color:var(--onac);border-radius:8px;padding:2px 10px;font-size:17px}
.rw{display:flex;gap:6px;align-items:center}.rw input{margin:3px 0;min-width:0}.rw .o2{width:90px;flex:none}
.rw .x{border:1px solid var(--line);background:none;color:var(--bad);border-radius:10px;padding:10px 12px;font:inherit}
.av.big{width:96px;height:96px;font-size:40px;margin:0}
.pf{text-align:center;padding:8px 0 4px}.pf h2{margin:10px 0 0}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.sg div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.sg b{display:block;font-size:22px}.sg small{color:var(--mu)}
.pl{cursor:pointer}
.hi{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.wkn{display:flex;justify-content:space-between;align-items:center}
.wkn button{border:1px solid var(--line);background:none;color:var(--tx);border-radius:10px;padding:6px 16px;font:inherit}
.wkn button:disabled{opacity:.35}
</style>
<script>
document.documentElement.dataset.theme=(function(){try{var t=localStorage.getItem('th');if(t)return t}catch(e){}return matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'})();
</script>
</head>
<body>
<button id="tg" onclick="flip()" aria-label="Změnit vzhled"></button>
<div id="auth" hidden>
  <h1>🎲 Třídní sázky</h1>
  <p class="m">Sázej mincemi na dění v hodinách. Žádné skutečné peníze, jen sláva.</p>
  <input id="n" placeholder="Jméno" maxlength="15" autocomplete="username">
  <input id="p" type="password" placeholder="Heslo (aspoň 6 znaků)" autocomplete="current-password">
  <div class="err" id="err"></div>
  <button class="btn" onclick="auth(false)">Přihlásit se</button>
  <button class="btn sec" onclick="auth(true)">Vytvořit účet (dostaneš 1000 mincí)</button>
</div>
<div id="app" hidden></div>
<input id="ph" type="file" accept="image/*" hidden onchange="upPhoto(this)">
<script>
const SB_URL='https://nibrzkupysdhdkmbgcsi.supabase.co';
const SB_KEY='sb_publishable_34HYSU_0Li3n1RAEtcTHcA_OQN0CxNR';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
const SUBJ=['ČJL','MAT','EKO','ANJ','UCE','MAM','PRA','NEJ','PRXU','TEV','PEK','HOZ','IDK','Jiné'];
let uid=null,me=null,tab='bets',sel=null,data={bets:[],opts:[],wagers:[],profiles:[]};
const OD=o=>(data.odds&&data.odds[o.id])||Number(o.odds);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>new Date(d).toLocaleString('cs-CZ',{weekday:'short',day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'});
const mail=n=>'u'+[...new TextEncoder().encode(n.trim().toLowerCase())].map(b=>b.toString(16).padStart(2,'0')).join('')+'@trida.app';
const err=t=>{$('#err').textContent=t};

async function auth(reg){
  const n=$('#n').value.trim(),p=$('#p').value;err('');
  if(!n||p.length<6)return err('Zadej jméno a heslo (aspoň 6 znaků).');
  let r;
  if(reg){
    const a=await sb.rpc('name_available',{n});
    if(a.error)return err('Chyba spojení: '+a.error.message);
    if(!a.data)return err('Toto jméno už někdo má.');
    r=await sb.auth.signUp({email:mail(n),password:p,options:{data:{name:n}}});
  }else r=await sb.auth.signInWithPassword({email:mail(n),password:p});
  if(r.error)return err(/invalid/i.test(r.error.message)?'Špatné jméno nebo heslo.':r.error.message);
  start();
}
async function out(){await sb.auth.signOut();location.reload()}

async function start(){
  const{data:{session}}=await sb.auth.getSession();
  if(!session){$('#auth').hidden=false;$('#app').hidden=true;return}
  uid=session.user.id;$('#auth').hidden=true;$('#app').hidden=false;
  await load();
}
async function load(){
  const[b,o,w,p,od]=await Promise.all([
    sb.from('bets').select('*'),sb.from('bet_options').select('*'),
    sb.from('wagers').select('*'),sb.from('profiles').select('*'),sb.rpc('all_odds')]);
  const odds={};(od.data||[]).forEach(x=>odds[x.option_id]=Number(x.odds));
  data={bets:b.data||[],opts:o.data||[],wagers:w.data||[],profiles:p.data||[],odds};
  me=data.profiles.find(x=>x.id===uid);render();
}
setInterval(()=>{const f=document.activeElement;if(uid&&tab!='add'&&!(f&&f.tagName=='INPUT'))load()},10000);

function render(){
  if(!me){$('#app').innerHTML='<main class="m">Načítám…</main>';return}
  const tabs=[['bets','Sázky'],['top','Žebříček']];if(me.is_admin)tabs.push(['add','Přidat']);
  $('#app').innerHTML=`<header><b>🎲 Třídní sázky</b><span style="display:flex;align-items:center">${av(me,'me')}${esc(me.name)}&nbsp;<b>🪙 ${me.balance}</b><a onclick="out()">odhlásit</a></span></header>
  <nav>${tabs.map(([k,l])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';sel=null;render()">${l}</button>`).join('')}</nav>
  <main>${tab=='bets'?betsView():tab=='top'?topView():tab=='prof'?statsView(data.profiles.find(x=>x.id==pid)||me):addView()}</main>`;
}
function betsView(){
  const now=new Date(),L=[],C=[];
  data.bets.forEach(b=>(b.status=='open'&&new Date(b.closes_at)>now?L:C).push(b));
  L.sort((a,b)=>new Date(a.closes_at)-new Date(b.closes_at));
  C.sort((a,b)=>new Date(b.closes_at)-new Date(a.closes_at));
  return '<p class="m">Kurzy se mění podle toho, kolik se na co vsadilo. Platí kurz z chvíle, kdy vsadíš.</p>'+(L.length?L.map(card).join(''):'<p class="m">Teď nejsou žádné otevřené sázky.</p>')+(C.length?'<h3>Uzavřené</h3>'+C.map(card).join(''):'');
}
function card(b){
  const os=data.opts.filter(o=>o.bet_id==b.id),ws=data.wagers.filter(w=>w.bet_id==b.id),mine=ws.filter(w=>w.user_id==uid);
  const tot=ws.reduce((s,w)=>s+w.amount,0),live=b.status=='open'&&new Date(b.closes_at)>new Date();
  const st=b.status=='settled'?'✅ Vyhodnoceno':b.status=='cancelled'?'↩️ Zrušeno, mince vráceny':live?'⏳ Sázet můžeš do '+fmt(b.closes_at):'🔒 Čeká na vyhodnocení';
  const adm=me.is_admin&&b.status=='open';
  const opts=os.map(o=>{
    const mw=mine.filter(w=>w.option_id==o.id),m=mw.reduce((x,w)=>x+w.amount,0),pwin=mw.reduce((x,w)=>x+Math.floor(w.amount*w.odds),0);
    const win=b.status=='settled'&&b.winning_option_id==o.id;
    return `<div class="o ${sel==o.id?'sel':''} ${win?'win':''}" ${live?`onclick="pick(${o.id})"`:''}>
      <span>${win?'🏆 ':''}${esc(o.label)}</span>${adm?`<button class="a" onclick="event.stopPropagation();settle(${b.id},${o.id})">✓ vyhrálo</button>`:''}<b class="od">${OD(o).toFixed(2)}${OD(o)>Number(o.odds)+0.004?' ▲':OD(o)<Number(o.odds)-0.004?' ▼':''}</b>
      ${m?`<small>Tvoje sázka ${m} 🪙 → možná výhra ${pwin} 🪙</small>`:''}</div>`}).join('');
  const bar=live&&os.some(o=>o.id==sel)?`<div class="bar">${[10,50,100].map(v=>`<button onclick="$('#amt').value=${v};pw()">${v}</button>`).join('')}<input id="amt" type="number" min="1" inputmode="numeric" placeholder="částka" oninput="pw()"><button class="go" onclick="bet()">Vsadit</button></div><small class="m" id="pw"></small>`:'';
  const big=os.length>6,col=big&&!EX.has(b.id);
  const wl=(os.find(o=>o.id==b.winning_option_id)||{}).label;
  const cbtn=`<div class="o" onclick="tgl(${b.id})"><span>👥 Zobrazit všechny možnosti (${os.length}) ▾</span>${b.status=='settled'&&wl?`<small>🏆 Vyhrálo: ${esc(wl)}</small>`:''}${mine.length?`<small>Tvoje sázky celkem: ${mine.reduce((x,w)=>x+w.amount,0)} 🪙</small>`:''}</div>`;
  const hide=big?`<p><a onclick="tgl(${b.id})" style="margin:0">▴ Skrýt možnosti</a></p>`:'';
  let res='';
  if(b.status=='settled'&&mine.length){const net=mine.reduce((s,w)=>s+(w.payout||0)-w.amount,0);res=`<p class="${net>=0?'pos':'neg'}">Tvůj výsledek: ${net>=0?'+':''}${net} 🪙</p>`}
  return `<div class="c"><small>${esc(b.subject)} · ${st}</small><div class="t">${esc(b.title)}</div>${col?cbtn:opts+hide}${col?'':bar}${res}
    ${adm?`<p><a onclick="cancelBet(${b.id})" style="margin:0">Zrušit sázku</a></p>`:''}</div>`;
}
function topView(){
  return [...data.profiles].sort((a,b)=>b.balance-a.balance).map((p,i)=>`<div class="pl ${p.id==uid?'me':''}" onclick="openProf('${p.id}')"><span style="display:flex;align-items:center">${['🥇','🥈','🥉'][i]||i+1+'.'}&nbsp;${av(p)}${esc(p.name)}</span><span>🪙 ${p.balance}</span></div>`).join('');
}
const HRS={1:'8:00',2:'8:55',3:'9:55',4:'11:00',5:'11:55',6:'13:15',7:'14:05',8:'14:55',9:'15:45'};
const SCH={1:[[1,'ČJL'],[2,'MAT'],[3,'EKO'],[4,'EKO'],[5,'ANJ']],
2:[[1,'ČJL'],[2,'ANJ'],[3,'UCE'],[4,'UCE'],[5,'MAM'],[6,'ČJL'],[7,'PRA']],
3:[[1,'NEJ'],[2,'EKO'],[3,'PRXU'],[4,'PRXU'],[5,'UCE'],[6,'PRA'],[7,'TEV'],[8,'TEV'],[9,'NEJ']],
4:[[1,'PEK'],[2,'HOZ'],[3,'MAT'],[4,'HOZ'],[5,'ANJ'],[6,'IDK'],[8,'NEJ']],
5:[[3,'PRXU'],[4,'PRXU'],[5,'EKO'],[6,'MAM']]};
const DAYS=['','Po','Út','St','Čt','Pá'];
const DR0=()=>({subj:'MAT',title:'',close:'',rows:[{l:'Kluk',o:'1.90'},{l:'Holka',o:'1.90'}]});
let wk=0,dr=DR0();
const loc=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,16);
function monday(){const d=new Date();d.setHours(0,0,0,0);const w=d.getDay();d.setDate(d.getDate()-(w==0?6:w-1)+(w==0||w==6?7:0)+wk*7);return d}
function keep(){if($('#title'))dr={subj:$('#subj').value,title:$('#title').value,close:$('#close').value,rows:[...document.querySelectorAll('.rw')].map(r=>({l:r.children[0].value,o:r.children[1].value}))}}
function addRow(){keep();dr.rows.push({l:'',o:'2.00'});render()}
function delRow(i){keep();if(dr.rows.length>2){dr.rows.splice(i,1);render()}}
const CLASS=['Kuba','Bert','Batu','Ivan','Max','Andy','Dan','Filip','Lana','Žeňa','Michaela','Ilma','Elška','Renata','Anička','Sofie','Melissa','Nikola','Karolína','Isa','Lucie'];
function addNames(){keep();dr.rows=CLASS.map(n=>({l:n,o:'20.00'}));render()}
function resetRows(){keep();dr.rows=DR0().rows;render()}
const EX=new Set();
function tgl(id){EX.has(id)?EX.delete(id):EX.add(id);if(!EX.has(id)&&data.opts.some(o=>o.id==sel&&o.bet_id==id))sel=null;render()}
function week(n){keep();wk=Math.max(0,wk+n);render()}
function lesson(i,h,c){keep();const d=monday();d.setDate(d.getDate()+i);const[H,M]=HRS[h].split(':');d.setHours(+H,+M);dr.subj=c;dr.close=loc(d);render()}
function addView(){
  const m=monday(),now=new Date(),fr=new Date(m);fr.setDate(m.getDate()+4);
  if(!dr.close)dr.close=loc(new Date(Date.now()+864e5));
  const days=[1,2,3,4,5].map(i=>{
    const d=new Date(m);d.setDate(m.getDate()+i-1);
    const ch=SCH[i].map(([h,c])=>{
      const t=new Date(d),[H,M]=HRS[h].split(':');t.setHours(+H,+M);
      const on=dr.close==loc(t)&&dr.subj==c;
      return `<button class="ls ${on?'on':''}" ${t<now?'disabled':''} onclick="lesson(${i-1},${h},'${c}')"><small>${h}.</small>${c}</button>`}).join('');
    return `<div class="dy"><b>${DAYS[i]}<small>${d.getDate()}.${d.getMonth()+1}.</small></b><div>${ch}</div></div>`}).join('');
  return `<h3>Vyber hodinu z rozvrhu</h3>
  <div class="wkn"><button onclick="week(-1)" ${wk<1?'disabled':''}>‹</button><span>${m.getDate()}.${m.getMonth()+1}. – ${fr.getDate()}.${fr.getMonth()+1}.</span><button onclick="week(1)">›</button></div>
  ${days}
  <h3>Nová sázka</h3>
  <select id="subj">${SUBJ.map(s=>`<option ${s==dr.subj?'selected':''}>${s}</option>`).join('')}</select>
  <input id="title" placeholder="Otázka, např. Koho vyvolá první k tabuli?" value="${esc(dr.title)}">
  <p class="m" style="margin:8px 0 0">Sázky se uzavřou (po kliknutí na hodinu = začátek hodiny):</p>
  <input id="close" type="datetime-local" value="${dr.close}">
  <p class="m" style="margin:8px 0 0">Možnosti a počáteční kurzy (pak se samy mění podle sázek):</p>
  ${dr.rows.map((r,i)=>`<div class="rw"><input placeholder="Možnost" value="${esc(r.l)}"><input class="o2" type="number" step="0.01" min="1.01" inputmode="decimal" value="${esc(r.o)}"><button class="x" onclick="delRow(${i})">✕</button></div>`).join('')}
  <button class="btn sec" onclick="addRow()">+ Přidat možnost</button>
  <button class="btn sec" onclick="addNames()">👥 Přidat všechna jména ze třídy (${CLASS.length})</button>
  <p class="m" style="margin:6px 0">Každé jméno dostane kurz 20.00, uprav podle potřeby. <a onclick="resetRows()" style="margin:0">↺ Obnovit Kluk / Holka</a></p>
  <button class="btn" onclick="create()">Přidat sázku</button>`;
}

let pid=null;
function openProf(id){pid=id;tab='prof';sel=null;render();scrollTo(0,0)}
function statsView(p){
  const own=p.id==uid;
  const ws=data.wagers.filter(w=>w.user_id==p.id).map(w=>({w,b:data.bets.find(x=>x.id==w.bet_id),o:data.opts.find(x=>x.id==w.option_id)})).filter(x=>x.b);
  const done=ws.filter(x=>x.b.status=='settled'),won=done.filter(x=>x.w.payout>0),open=ws.filter(x=>x.b.status=='open');
  const staked=done.reduce((s,x)=>s+x.w.amount,0),net=done.reduce((s,x)=>s+(x.w.payout||0)-x.w.amount,0);
  const best=Math.max(0,...won.map(x=>x.w.payout-x.w.amount));
  const rank=[...data.profiles].sort((a,b)=>b.balance-a.balance).findIndex(x=>x.id==p.id)+1;
  const box=(v,l)=>`<div><b>${v}</b><small>${l}</small></div>`;
  const hist=[...ws].sort((a,b)=>new Date(b.w.created_at)-new Date(a.w.created_at)).slice(0,10).map(x=>{
    const st=x.b.status,n=(x.w.payout||0)-x.w.amount;
    const r=st=='open'?'⏳':st=='cancelled'?'↩️':x.w.payout>0?`<span class="pos">+${n}</span>`:`<span class="neg">${n}</span>`;
    return `<div class="hi">${st=='settled'?(x.w.payout>0?'✅':'❌'):''} ${esc(x.b.title)}<br><small class="m">${esc(x.o?x.o.label:'')} · ${x.w.amount} 🪙 × ${Number(x.w.odds).toFixed(2)} · ${r}</small></div>`}).join('');
  return `<a onclick="tab='top';render()" style="margin:0">‹ Žebříček</a>
  <div class="pf">${av(p,'big')}<h2>${esc(p.name)}</h2>
  ${own?`<button class="btn sec" style="width:auto;padding:8px 16px" onclick="$('#ph').click()">📷 ${p.avatar_at?'Změnit fotku':'Nahrát fotku'}</button>`:''}</div>
  <div class="sg">${box('🪙 '+p.balance,'Zůstatek')}${box(rank+'. z '+data.profiles.length,'Pořadí')}
  ${box(ws.filter(x=>x.b.status!='cancelled').length,'Sázek celkem')}${box(done.length?Math.round(won.length*100/done.length)+' %':'–','Úspěšnost')}
  ${box((net>0?'+':'')+net,'Čistý zisk 🪙')}${box(best?'+'+best:'–','Největší výhra')}
  ${box(staked,'Vsazeno celkem')}${box(open.length,'Probíhající sázky')}</div>
  <h3>Poslední sázky</h3>${hist||'<p class="m">Zatím žádné sázky.</p>'}`;
}
function pw(){const o=data.opts.find(o=>o.id==sel),a=parseInt($('#amt').value)||0;$('#pw').textContent=o&&a?'Při výhře dostaneš '+Math.floor(a*OD(o))+' 🪙':''}
function pick(id){sel=id;render()}
async function bet(){
  const a=parseInt($('#amt').value);if(!a||a<1)return alert('Zadej částku.');
  const so=data.opts.find(x=>x.id==sel);
  const r=await sb.rpc('place_bet',{p_option_id:sel,p_amount:a,p_odds:OD(so)});
  if(r.error){await load();return alert(r.error.message)}
  sel=null;await load();
}
async function create(){
  keep();const t=dr.title.trim(),c=dr.close;
  const L=dr.rows.map(r=>r.l.trim()),O=dr.rows.map(r=>parseFloat(String(r.o).replace(',','.')));
  if(!t||!c||L.some(x=>!x)||O.some(x=>!(x>=1.01)))return alert('Vyplň otázku, čas, názvy možností a kurzy (aspoň 1.01).');
  const r=await sb.rpc('create_bet',{p_subject:dr.subj,p_title:t,p_closes_at:new Date(c).toISOString(),p_options:L,p_odds:O});
  if(r.error)return alert(r.error.message);dr=DR0();tab='bets';await load();
}
async function settle(b,o){
  if(!confirm('Opravdu vyhodnotit? Mince se hned vyplatí.'))return;
  const r=await sb.rpc('settle_bet',{p_bet_id:b,p_option_id:o});
  if(r.error)return alert(r.error.message);await load();
}
async function cancelBet(b){
  if(!confirm('Zrušit sázku a vrátit všem mince?'))return;
  const r=await sb.rpc('cancel_bet',{p_bet_id:b});
  if(r.error)return alert(r.error.message);await load();
}
function paint(){$('#tg').textContent=document.documentElement.dataset.theme=='dark'?'☀️':'🌙'}
function flip(){const t=document.documentElement.dataset.theme=='dark'?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('th',t)}catch(e){}paint()}
const av=(p,c='')=>{
  const oc=c=='me'?` onclick="openProf('${p.id}')" title="Můj profil"`:'';
  if(p.avatar_at)return `<img class="av ${c}" src="${SB_URL}/storage/v1/object/public/avatars/${p.id}/avatar.jpg?v=${encodeURIComponent(p.avatar_at)}" alt=""${oc}>`;
  return `<span class="av ${c}"${oc}>${esc(p.name[0].toUpperCase())}</span>`;
};
async function upPhoto(inp){
  const f=inp.files[0];inp.value='';if(!f)return;
  const img=new Image();img.src=URL.createObjectURL(f);
  try{await img.decode()}catch(e){return alert('Tento obrázek nejde načíst. Zkus jiný.')}
  const s=Math.min(img.width,img.height),c=document.createElement('canvas');c.width=c.height=256;
  c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,256,256);
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.85));
  const u=await sb.storage.from('avatars').upload(uid+'/avatar.jpg',blob,{upsert:true,contentType:'image/jpeg'});
  if(u.error)return alert(u.error.message);
  const r=await sb.rpc('set_avatar');
  if(r.error)return alert(r.error.message);
  await load();
}
paint();start();
</script>
