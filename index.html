<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Třídní sázky</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<style>
:root{color-scheme:dark;--bg:#0b0b0c;--card:#161618;--line:#2c2c30;--tx:#f2f2f2;--mu:#9a9aa2;--ac:#f2c94c;--onac:#111;--ok:#6fcf97;--bad:#eb7b6b;--in:#0f0f11;--winbg:#14281c}
:root[data-theme=light]{color-scheme:light;--bg:#f4f4f6;--card:#fff;--line:#d9d9de;--tx:#17171a;--mu:#6b6b75;--ac:#b86e00;--onac:#fff;--ok:#1f9d55;--bad:#d64545;--in:#f0f0f3;--winbg:#e3f5ea}
#tg{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:22px;box-shadow:0 2px 8px #0004;z-index:5;padding:0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 "Trebuchet MS",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(70px + env(safe-area-inset-bottom))}
main,header,nav,#auth{max-width:560px;margin:0 auto;padding:12px 14px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
header span{font-size:14px;color:var(--mu)}header b{color:var(--tx)}
a{color:var(--ac);cursor:pointer;margin-left:6px}
nav{display:flex;gap:8px;padding-top:0}
nav button{flex:1;padding:10px;border:1px solid var(--line);background:none;color:var(--mu);border-radius:10px;font:inherit}
nav .on{background:var(--ac);color:var(--onac);border-color:var(--ac);font-weight:bold}
h1{font-size:30px;margin:30px 0 4px}h3{color:var(--mu);font-weight:normal;margin:24px 0 8px}
.m{color:var(--mu)}
input,select,textarea{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid var(--line);background:var(--in);color:var(--tx);font:inherit}
.btn,.go{background:var(--ac);color:var(--onac);border:0;border-radius:10px;padding:12px 16px;font:inherit;font-weight:bold;width:100%;margin-top:6px}
.btn.sec{background:none;color:var(--ac);border:1px solid var(--ac)}
.err{color:var(--bad);min-height:22px}
.c{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.c small{color:var(--mu)}.c .t{font-size:18px;margin:2px 0 8px}
.o{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 8px;padding:12px;margin-top:8px;border:1px solid var(--line);border-radius:10px;background:var(--in)}
.o.sel{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.o.win{border-color:var(--ok);background:var(--winbg)}
.o small{width:100%}
.a{background:none;border:1px solid var(--ok);color:var(--ok);border-radius:8px;padding:4px 8px;font:inherit;font-size:13px}
.bar{display:flex;gap:6px;margin-top:10px}.bar input{margin:0;flex:1;min-width:0}
.bar button{border:1px solid var(--line);background:none;color:var(--tx);border-radius:10px;padding:0 12px;font:inherit}
.bar .go{width:auto;margin:0;border:0;background:var(--ac);color:var(--onac)}
.pl{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.pl.me{color:var(--ac);font-weight:bold}
.av{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--line);display:inline-flex;align-items:center;justify-content:center;font-weight:bold;margin-right:8px;flex:none;color:var(--tx)}
.av.me{cursor:pointer;border:2px solid var(--ac)}
.pos{color:var(--ok)}.neg{color:var(--bad)}
</style>
<script>
document.documentElement.dataset.theme=(function(){try{var t=localStorage.getItem('th');if(t)return t}catch(e){}return matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'})();
</script>
</head>
<body>
<button id="tg" onclick="flip()" aria-label="Změnit vzhled"></button>
<div id="auth" hidden>
  <h1>🎲 Třídní sázky</h1>
  <p class="m">Sázej mincemi na dění v hodinách. Žádné skutečné peníze, jen sláva.</p>
  <input id="n" placeholder="Jméno" maxlength="15" autocomplete="username">
  <input id="p" type="password" placeholder="Heslo (aspoň 6 znaků)" autocomplete="current-password">
  <div class="err" id="err"></div>
  <button class="btn" onclick="auth(false)">Přihlásit se</button>
  <button class="btn sec" onclick="auth(true)">Vytvořit účet (dostaneš 1000 mincí)</button>
</div>
<div id="app" hidden></div>
<input id="ph" type="file" accept="image/*" hidden onchange="upPhoto(this)">
<script>
const SB_URL='https://nibrzkupysdhdkmbgcsi.supabase.co';
const SB_KEY='sb_publishable_34HYSU_0Li3n1RAEtcTHcA_OQN0CxNR';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
const SUBJ=['ČJL','MAT','EKO','ANJ','UCE','MAM','PRA','NEJ','PRXU','TEV','PEK','HOZ','IDK','Jiné'];
let uid=null,me=null,tab='bets',sel=null,data={bets:[],opts:[],wagers:[],profiles:[]};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>new Date(d).toLocaleString('cs-CZ',{weekday:'short',day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'});
const mail=n=>'u'+[...new TextEncoder().encode(n.trim().toLowerCase())].map(b=>b.toString(16).padStart(2,'0')).join('')+'@trida.app';
const err=t=>{$('#err').textContent=t};

async function auth(reg){
  const n=$('#n').value.trim(),p=$('#p').value;err('');
  if(!n||p.length<6)return err('Zadej jméno a heslo (aspoň 6 znaků).');
  let r;
  if(reg){
    const a=await sb.rpc('name_available',{n});
    if(a.error)return err('Chyba spojení: '+a.error.message);
    if(!a.data)return err('Toto jméno už někdo má.');
    r=await sb.auth.signUp({email:mail(n),password:p,options:{data:{name:n}}});
  }else r=await sb.auth.signInWithPassword({email:mail(n),password:p});
  if(r.error)return err(/invalid/i.test(r.error.message)?'Špatné jméno nebo heslo.':r.error.message);
  start();
}
async function out(){await sb.auth.signOut();location.reload()}

async function start(){
  const{data:{session}}=await sb.auth.getSession();
  if(!session){$('#auth').hidden=false;$('#app').hidden=true;return}
  uid=session.user.id;$('#auth').hidden=true;$('#app').hidden=false;
  await load();
}
async function load(){
  const[b,o,w,p]=await Promise.all([
    sb.from('bets').select('*'),sb.from('bet_options').select('*'),
    sb.from('wagers').select('*'),sb.from('profiles').select('*')]);
  data={bets:b.data||[],opts:o.data||[],wagers:w.data||[],profiles:p.data||[]};
  me=data.profiles.find(x=>x.id===uid);render();
}
setInterval(()=>{const f=document.activeElement;if(uid&&tab!='add'&&!(f&&f.tagName=='INPUT'))load()},20000);

function render(){
  if(!me){$('#app').innerHTML='<main class="m">Načítám…</main>';return}
  const tabs=[['bets','Sázky'],['top','Žebříček']];if(me.is_admin)tabs.push(['add','Přidat']);
  $('#app').innerHTML=`<header><b>🎲 Třídní sázky</b><span style="display:flex;align-items:center">${av(me,'me')}${esc(me.name)}&nbsp;<b>🪙 ${me.balance}</b><a onclick="out()">odhlásit</a></span></header>
  <nav>${tabs.map(([k,l])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';sel=null;render()">${l}</button>`).join('')}</nav>
  <main>${tab=='bets'?betsView():tab=='top'?topView():addView()}</main>`;
}
function betsView(){
  const now=new Date(),L=[],C=[];
  data.bets.forEach(b=>(b.status=='open'&&new Date(b.closes_at)>now?L:C).push(b));
  L.sort((a,b)=>new Date(a.closes_at)-new Date(b.closes_at));
  C.sort((a,b)=>new Date(b.closes_at)-new Date(a.closes_at));
  return (L.length?L.map(card).join(''):'<p class="m">Teď nejsou žádné otevřené sázky.</p>')+(C.length?'<h3>Uzavřené</h3>'+C.map(card).join(''):'');
}
function card(b){
  const os=data.opts.filter(o=>o.bet_id==b.id),ws=data.wagers.filter(w=>w.bet_id==b.id),mine=ws.filter(w=>w.user_id==uid);
  const tot=ws.reduce((s,w)=>s+w.amount,0),live=b.status=='open'&&new Date(b.closes_at)>new Date();
  const st=b.status=='settled'?'✅ Vyhodnoceno':b.status=='cancelled'?'↩️ Zrušeno, mince vráceny':live?'⏳ Sázet můžeš do '+fmt(b.closes_at):'🔒 Čeká na vyhodnocení';
  const adm=me.is_admin&&b.status=='open';
  const opts=os.map(o=>{
    const p=ws.filter(w=>w.option_id==o.id).reduce((s,w)=>s+w.amount,0),m=mine.filter(w=>w.option_id==o.id).reduce((s,w)=>s+w.amount,0);
    const win=b.status=='settled'&&b.winning_option_id==o.id;
    return `<div class="o ${sel==o.id?'sel':''} ${win?'win':''}" ${live?`onclick="pick(${o.id})"`:''}>
      <span>${win?'🏆 ':''}${esc(o.label)}</span>${adm?`<button class="a" onclick="event.stopPropagation();settle(${b.id},${o.id})">✓ vyhrálo</button>`:''}
      <small>V banku ${p} 🪙 (${tot?Math.round(p*100/tot):0} %)${m?' · tvoje sázka '+m:''}</small></div>`}).join('');
  const bar=live&&os.some(o=>o.id==sel)?`<div class="bar">${[10,50,100].map(v=>`<button onclick="$('#amt').value=${v}">${v}</button>`).join('')}<input id="amt" type="number" min="1" inputmode="numeric" placeholder="částka"><button class="go" onclick="bet()">Vsadit</button></div>`:'';
  let res='';
  if(b.status=='settled'&&mine.length){const net=mine.reduce((s,w)=>s+(w.payout||0)-w.amount,0);res=`<p class="${net>=0?'pos':'neg'}">Tvůj výsledek: ${net>=0?'+':''}${net} 🪙</p>`}
  return `<div class="c"><small>${esc(b.subject)} · ${st}</small><div class="t">${esc(b.title)}</div>${opts}${bar}${res}
    ${adm?`<p><a onclick="cancelBet(${b.id})" style="margin:0">Zrušit sázku</a></p>`:''}</div>`;
}
function topView(){
  return [...data.profiles].sort((a,b)=>b.balance-a.balance).map((p,i)=>`<div class="pl ${p.id==uid?'me':''}"><span style="display:flex;align-items:center">${['🥇','🥈','🥉'][i]||i+1+'.'}&nbsp;${av(p)}${esc(p.name)}</span><span>🪙 ${p.balance}</span></div>`).join('');
}
function addView(){
  const d=new Date(Date.now()+864e5);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());
  return `<h3>Nová sázka</h3>
  <select id="subj">${SUBJ.map(s=>`<option>${s}</option>`).join('')}</select>
  <input id="title" placeholder="Otázka, např. Koho vyvolá první k tabuli?">
  <p class="m" style="margin:8px 0 0">Sázky se uzavřou:</p>
  <input id="close" type="datetime-local" value="${d.toISOString().slice(0,16)}">
  <p class="m" style="margin:8px 0 0">Možnosti (každá na nový řádek):</p>
  <textarea id="opts" rows="4">Kluk
Holka</textarea>
  <button class="btn" onclick="create()">Přidat sázku</button>`;
}

function pick(id){sel=id;render()}
async function bet(){
  const a=parseInt($('#amt').value);if(!a||a<1)return alert('Zadej částku.');
  const r=await sb.rpc('place_bet',{p_option_id:sel,p_amount:a});
  if(r.error)return alert(r.error.message);sel=null;await load();
}
async function create(){
  const o=$('#opts').value.split('\n').map(s=>s.trim()).filter(Boolean),t=$('#title').value.trim(),c=$('#close').value;
  if(!t||!c||o.length<2)return alert('Vyplň otázku, čas a aspoň 2 možnosti.');
  const r=await sb.rpc('create_bet',{p_subject:$('#subj').value,p_title:t,p_closes_at:new Date(c).toISOString(),p_options:o});
  if(r.error)return alert(r.error.message);tab='bets';await load();
}
async function settle(b,o){
  if(!confirm('Opravdu vyhodnotit? Mince se hned vyplatí.'))return;
  const r=await sb.rpc('settle_bet',{p_bet_id:b,p_option_id:o});
  if(r.error)return alert(r.error.message);await load();
}
async function cancelBet(b){
  if(!confirm('Zrušit sázku a vrátit všem mince?'))return;
  const r=await sb.rpc('cancel_bet',{p_bet_id:b});
  if(r.error)return alert(r.error.message);await load();
}
function paint(){$('#tg').textContent=document.documentElement.dataset.theme=='dark'?'☀️':'🌙'}
function flip(){const t=document.documentElement.dataset.theme=='dark'?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('th',t)}catch(e){}paint()}
const av=(p,c='')=>{
  const oc=c=='me'?` onclick="$('#ph').click()" title="Změnit fotku"`:'';
  if(p.avatar_at)return `<img class="av ${c}" src="${SB_URL}/storage/v1/object/public/avatars/${p.id}/avatar.jpg?v=${encodeURIComponent(p.avatar_at)}" alt=""${oc}>`;
  return `<span class="av ${c}"${oc}>${esc(p.name[0].toUpperCase())}</span>`;
};
async function upPhoto(inp){
  const f=inp.files[0];inp.value='';if(!f)return;
  const img=new Image();img.src=URL.createObjectURL(f);
  try{await img.decode()}catch(e){return alert('Tento obrázek nejde načíst. Zkus jiný.')}
  const s=Math.min(img.width,img.height),c=document.createElement('canvas');c.width=c.height=256;
  c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,256,256);
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.85));
  const u=await sb.storage.from('avatars').upload(uid+'/avatar.jpg',blob,{upsert:true,contentType:'image/jpeg'});
  if(u.error)return alert(u.error.message);
  const r=await sb.rpc('set_avatar');
  if(r.error)return alert(r.error.message);
  await load();
}
paint();start();
</script>
</body>
</html>
